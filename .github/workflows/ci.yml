# Builds the app and runs the tests on macOS for each pull request and each push to develop.
# Tests that use the live screen, keys or the microphone stay skipped: they need an EARSHOT_* variable.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift build and test
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode 26
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          echo "Using $xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            app/.build
          key: spm-${{ runner.os }}-${{ hashFiles('app/Package.swift', 'app/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build

      # D-11: the wake model tests download about 18 MB from Hugging Face one time (pinned revisions,
      # SHA-256 checked) and run the models on speech from the say command. The cache keeps the files.
      - name: Cache the wake phrase models
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/earshot-wake-models
          key: wake-models-${{ hashFiles('app/Sources/EarshotWake/ModelFiles.swift') }}

      # The tests run on the release build, the same build as the app bundle (build-app.sh).
      # The latency benches (OfflineBench, MenuBench) assert release limits there. A debug build
      # on a shared runner is about 15 times slower and does not show the latency of the app.
      - name: Test (release build)
        env:
          EARSHOT_WAKE_MODELS: ${{ runner.temp }}/earshot-wake-models
        run: swift test -c release -Xswiftc -enable-testing

      # The app bundle must not depend on the Xcode of the build Mac (rpaths, Swift libraries).
      # build-app.sh fails if an rpath outside the bundle and /usr/lib/swift stays.
      - name: Build the app bundle
        env:
          EARSHOT_APP_OUT: ${{ runner.temp }}/Earshot.app
        run: |
          set -euo pipefail
          scripts/build-app.sh
          exe="$EARSHOT_APP_OUT/Contents/MacOS/earshot"
          echo "rpaths:"; otool -l "$exe" | awk '$2 == "LC_RPATH" { getline; getline; print "  " $2 }'
          echo "Swift libraries:"; otool -L "$exe" | grep -i swift || true
          ls -la "$EARSHOT_APP_OUT/Contents/Frameworks"
          codesign --verify --deep --strict "$EARSHOT_APP_OUT"

  # The PA plugin (plugins/pa) is a separate Swift package. It is not a part of the app (R-PL-1).
  pa:
    name: PA plugin build and test
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: plugins/pa
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode 26
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          echo "Using $xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          swift --version

      - name: Build
        run: swift build

      # The probes and the go marks print lines that start with PROBE or MARK. The pull request records them.
      - name: Test
        # pipefail: a failed test must fail the step. Without it, tee hid a failure.
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/pa-test.log"

      - name: Probe and mark lines
        if: always()
        run: grep -E "PROBE|MARK|CONTRACT" "$RUNNER_TEMP/pa-test.log" || true

      # Phase 2, Q1: the GGUF files of candidates 3 and 4, at a fixed revision with a SHA-256 check.
      # CI only checks the download. The bench of candidates 3 and 4 runs on the Mac (Apple GPU):
      # on the CI machine one run used all of the 30 minutes.
      - name: Cache the embedding models
        uses: actions/cache@v4
        with:
          path: ~/pa-models
          key: pa-models-qwen3-370f27d-gemma-0f741b5

      - name: Get the embedding models
        run: |
          scripts/get-model.sh qwen3 ~/pa-models
          scripts/get-model.sh gemma ~/pa-models

      # Phase 2, Q1: the embedding bench on the made-up fixtures (docs/experiments/E10-pa-embedding.md).
      # The hash model and the macOS sentence model only. The contextual model is out: E10 has its numbers, and its
      # request for macOS data can wait for many minutes on the CI machine.
      - name: Embedding bench
        if: always()
        timeout-minutes: 12
        run: |
          set -uo pipefail
          swift build -c release --product earshot-pa
          fx=Tests/PACoreTests/Fixtures/phase2
          for e in hash nl-sentence; do
            for d in full 256; do
              echo "=== bench $e, numbers: $d"
              if [ "$d" = full ]; then extra=""; else extra="--dims 256"; fi
              .build/release/earshot-pa --embed-bench "$fx" --embedder "$e" --get-assets $extra 2>/dev/null || echo "bench $e failed"
            done
          done

      - name: Build the app bundle (no install)
        env:
          PA_NO_INSTALL: "1"
        run: |
          set -euo pipefail
          scripts/install-pa.sh
          otool -s __TEXT __info_plist .build/EarshotPA.app/Contents/MacOS/earshot-pa | head -n 3
          codesign -dv .build/EarshotPA.app 2>&1 | grep -E "Identifier|Signature"
          # The model runtime is in the bundle, and the program finds it (rpath @executable_path/../Frameworks).
          test -d .build/EarshotPA.app/Contents/Frameworks/llama.framework
          .build/EarshotPA.app/Contents/MacOS/earshot-pa --embed-bench Tests/PACoreTests/Fixtures/phase2 --embedder hash | head -n 4
