# Makes the tag vX.Y.Z and a GitHub release for each push to main.
# X.Y.Z comes from the VERSION file. The release notes come from the CHANGELOG.md section of X.Y.Z.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version and the release notes
        id: version
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=VERSION::VERSION must be MAJOR.MINOR.PATCH. It is '$version'."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::warning::The tag v$version exists. Increase VERSION and add a CHANGELOG.md section to make a release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          .github/scripts/changelog-section.sh "$version" > "$RUNNER_TEMP/notes.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Make the tag and the release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "earshot v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" --latest
