# Makes a pre-release tag vX.Y.Z-dev.N and a GitHub pre-release for each push to develop.
# docs/RELEASING.md gives the rules for X.Y.Z and N.
name: Pre-release

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prerelease
  cancel-in-progress: false

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate the pre-release tag
        id: tag
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error file=VERSION::VERSION must be MAJOR.MINOR.PATCH. It is '$version'."
            exit 1
          fi
          major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            base="$major.$((minor + 1)).0"
          else
            base="$version"
          fi
          # If this commit already has a pre-release tag (for example, after a second run), stop.
          existing="$(git tag --points-at HEAD -l "v*-dev.*" | head -n 1)"
          if [ -n "$existing" ]; then
            echo "This commit already has the tag $existing."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last="$(git tag -l "v$base-dev.*" | sed "s/^v$base-dev\.//" | sort -n | tail -n 1)"
          n=$(( ${last:-0} + 1 ))
          previous="$(git describe --tags --abbrev=0 --match 'v*' HEAD 2> /dev/null || true)"
          echo "tag=v$base-dev.$n" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Make the tag and the pre-release
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          PREVIOUS: ${{ steps.tag.outputs.previous }}
        run: |
          set -euo pipefail
          args=(--target "$GITHUB_SHA" --title "earshot $TAG" --prerelease --generate-notes)
          if [ -n "$PREVIOUS" ]; then args+=(--notes-start-tag "$PREVIOUS"); fi
          gh release create "$TAG" "${args[@]}"
